name: Release

on:
  push:
    branches: [main]
    # Tooling-only pushes must not be able to cut a release, whatever their
    # commit type says.
    #
    # 2.13.0 shipped as an empty release because three commits touching only
    # `scripts/` and `.github/` were typed `feat(announce)` / `fix(announce)`.
    # Both are release-triggering, so semantic-release did exactly what it was
    # told — every user on 2.12.0 was offered an update with a blank changelog.
    # Relying on remembering to type those `ci:` had already failed once.
    #
    # Neither path is part of what a user installs: `scripts/` is dev tooling
    # and `.github/` is CI. GitHub skips the run only when EVERY changed file
    # matches, so a push that touches shipped code alongside a workflow still
    # releases correctly.
    #
    # `docs/**` is deliberately NOT here — `docs(readme)` is configured to bump
    # a patch, and `docs/release-notes/next.md` is the release body itself.
    paths-ignore:
      - 'scripts/**'
      - '.github/**'

permissions:
  contents: write
  issues: write
  pull-requests: write

# Opt every JS-based action into the Node 24 runner. Removes deprecation
# warnings for actions still packaged against Node 20 (e.g. pnpm/action-setup@v4).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm size
      - env:
          # Uses a user-provided PAT stored as the repo secret `GH_TOKEN`.
          # Required because the auto-provided `GITHUB_TOKEN` can't push
          # release commits/tags that trigger downstream workflows, and
          # GitHub reserves the `GITHUB_` prefix for built-in tokens —
          # user secrets can't be named `GITHUB_TOKEN`.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm exec semantic-release
