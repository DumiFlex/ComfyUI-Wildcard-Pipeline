name: PR title

# Feature PRs are squash-merged, so the PR title becomes the commit that
# release-please reads. It must be a Conventional Commit: feat:, fix:, docs:, ...

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
