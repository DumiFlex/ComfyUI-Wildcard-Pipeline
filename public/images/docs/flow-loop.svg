<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" role="img" aria-label="WP Context Loop drives WP Context and the Prompt Assembler to produce N prompts, CLIP Encode turns them into conditioning for KSampler, and WP Seed List supplies the matching seed for each iteration directly to KSampler">
  <style><![CDATA[
    .frame, .card, .pill, .chip { stroke-width: 1; }
    .cap { font: 400 10px 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: .06em; }
    .feeder { font: 400 10.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .nm { font: 600 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .id { font: 400 9.5px 'JetBrains Mono', Consolas, Monaco, 'Courier New', monospace; }
    .lbl, .varcap { font: 400 9.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: .05em; }
    .chipt { font: 400 10.5px 'JetBrains Mono', Consolas, Monaco, 'Courier New', monospace; }

    .frame { fill: #1e1e1e; stroke: #3a3a3a; }
    .card { fill: #232323; stroke: #4a4a4a; }
    .card--wp { stroke: #2dd4bf; stroke-opacity: .55; }
    .ico--wp { color: #2dd4bf; }
    .ico--ext { color: #aaaaaa; }
    .ico--wildcard { color: #a78bfa; }
    .ico--fixed { color: #22d3ee; }
    .ico--combine { color: #34d399; }
    .ico--derivation { color: #fbbf24; }
    .ico--constraint { color: #f472b6; }
    .pill { fill: #232323; stroke: #3a3a3a; }
    .feeder { fill: #aaaaaa; }
    .nm { fill: #dddddd; }
    .id, .lbl, .cap, .varcap { fill: #666666; }
    .ln { stroke: #4a4a4a; }
    .wash { stop-color: #2dd4bf; }
    .flow0 { stop-color: #4a4a4a; }
    .head { fill: #4a4a4a; }
    .chip { fill: #232323; }
    .chip--a { stroke: #8b5cf6; stroke-opacity: .4; }
    .chip--b { stroke: #22d3ee; stroke-opacity: .4; }
    .chip--c { stroke: #34d399; stroke-opacity: .4; }
    .chipt--a { fill: #c4b5fd; }
    .chipt--b { fill: #67e8f9; }
    .chipt--c { fill: #86efac; }
    @media (prefers-color-scheme: light) {
      .frame { fill: #f5f5f5; stroke: #b0b0b0; }
      .card { fill: #ffffff; stroke: #999999; }
      .card--wp { stroke: #0f766e; stroke-opacity: .55; }
      .ico--wp { color: #0f766e; }
      .ico--ext { color: #555555; }
      .ico--wildcard { color: #6d28d9; }
      .ico--fixed { color: #1d4ed8; }
      .ico--combine { color: #065f46; }
      .ico--derivation { color: #92400e; }
      .ico--constraint { color: #9d174d; }
      .pill { fill: #ffffff; stroke: #b0b0b0; }
      .feeder { fill: #555555; }
      .nm { fill: #1a1a1a; }
      .id,   .lbl,   .cap,   .varcap { fill: #888888; }
      .ln { stroke: #999999; }
      .wash { stop-color: #0f766e; }
      .flow0 { stop-color: #999999; }
      .head { fill: #999999; }
      .chip { fill: #ffffff; }
      .chip--a { stroke: #8b5cf6; stroke-opacity: .4; }
      .chip--b { stroke: #22d3ee; stroke-opacity: .4; }
      .chip--c { stroke: #34d399; stroke-opacity: .4; }
      .chipt--a { fill: #6d28d9; }
      .chipt--b { fill: #1d4ed8; }
      .chipt--c { fill: #065f46; }
    }
  ]]></style>
  <defs>
    <!-- Mirrors the SPA frame wash. The CSS is an ellipse 120 percent of the
         width by 100 percent of the HEIGHT, anchored top-left — so it spans
         the whole panel. Squashing it by the aspect ratio instead pins it to
         the corner and leaves the rest looking flat. -->
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="scale(1.2 1)">
      <stop class="wash" offset="0" stop-opacity="0.10"/>
      <stop class="wash" offset="0.6" stop-opacity="0.02"/>
      <stop class="wash" offset="1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flowv" x1="0" y1="0" x2="0" y2="1">
      <stop class="flow0" offset="0" stop-opacity="0"/>
      <stop class="flow0" offset="0.25" stop-opacity="1"/>
      <stop class="flow0" offset="0.8" stop-opacity="1"/>
      <stop class="flow0" offset="1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop class="flow0" offset="0" stop-opacity="0"/>
      <stop class="flow0" offset="0.2" stop-opacity="1"/>
      <stop class="flow0" offset="0.8" stop-opacity="1"/>
      <stop class="flow0" offset="1" stop-opacity="0"/>
    </linearGradient>
  </defs>
