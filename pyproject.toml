[project]
name = "comfyui-wildcard-pipeline"
version = "2.21.0"
description = "Modular procedural prompt generation for ComfyUI — wildcards, constraints, derivations, and context pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "DumiFlex" }]
keywords = ["comfyui", "wildcards", "prompt-generation", "stable-diffusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.23",
    # ComfyUI ships PyYAML; the wildcard file importer reads .yaml packs with it.
    "pyyaml>=6.0",
    # ComfyUI ships Pillow; chat images are checked and re-encoded with it.
    "pillow>=10.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/DumiFlex/ComfyUI-Wildcard-Pipeline"
Repository = "https://github.com/DumiFlex/ComfyUI-Wildcard-Pipeline"
Issues = "https://github.com/DumiFlex/ComfyUI-Wildcard-Pipeline/issues"

[tool.comfy]
PublisherId = "dumiflex"
DisplayName = "Wildcard Pipeline"
# Square node icon shown next to the listing in the ComfyUI Manager.
# Max 400×400 per the Registry spec. SVG so it scales without the
# Manager refetching at higher DPI.
Icon = "https://raw.githubusercontent.com/DumiFlex/ComfyUI-Wildcard-Pipeline/main/public/images/favicon.svg"
# Card banner (7:3, the Manager card's aspect). The new ComfyUI Manager
# shows it about 275 px wide, so it carries the logo and a node-graph
# shape and no text: the card prints the name under it. The text-heavy
# public/images/comfy-banner.svg stays for places that show it large.
# Served from main by GitHub raw, so it changes when main does.
Banner = "https://raw.githubusercontent.com/DumiFlex/ComfyUI-Wildcard-Pipeline/main/public/images/comfy-card-banner.svg"

# ComfyUI version floor: the oldest ComfyUI that has every V3 API the
# nodes use. The newest one is `io.Schema(accept_all_inputs=...)`
# (WP Context Injector), added in ComfyUI 0.11.0; io.Schema is a
# dataclass, so ComfyUI 0.3.48-0.10 stops registering our nodes there
# (only the four listed before it load), and anything older has no
# comfy_api.latest at all. The Manager reads this to warn before
# installing on an older ComfyUI.
requires-comfyui = ">=0.11.0"

# Force-include built artifacts that are gitignored so the publish
# action's "everything git tracks" default would otherwise drop them.
# js/ + web/ are the Vite output trees that the extension + manager
# SPA load at runtime; without them the canvas widgets fail to mount
# and the sidebar SPA route 404s.
includes = ["js", "web"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["js", "web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The example packs are data written as code: long option strings, and `O`
# reads as "option" there.
"scripts/example_workflows/*" = ["E501", "E742"]

[tool.pyright]
# conftest.py prepends the project root to sys.path; mirror that for Pyright
# so `from engine.template import ...` resolves in tests and editor.
extraPaths = ["."]
include = ["engine", "wp_nodes", "wp_api", "tests", "conftest.py"]
exclude = ["node_modules", "js", "web", ".venv", "**/__pycache__"]
# CI runs `pyright engine wp_nodes wp_api` (see .github/workflows/ci.yml).
# ComfyUI and torch aren't installed there; their imports stay unresolved.
reportMissingImports = "none"
# The code reads untrusted JSON as `x.get(k) if isinstance(x.get(k), dict)
# else {}`, which is safe but which Pyright can't narrow (a second `.get`
# call). These four rules flag that idiom hundreds of times and nothing else
# of note; every other basic-mode rule is on.
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalIterable = "none"
reportOptionalOperand = "none"


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q -m 'not fuzz and not perf'"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "fuzz: long-running fuzz tests (opt-in via -m fuzz)",
    "perf: performance regression tests (opt-in via -m perf)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
source = ["engine", "wp_api"]
omit = [
    "engine/db/migrations_sql/*",
]

[tool.coverage.report]
# CI runs pytest with --cov, so this gates every PR. Anchored a few points
# under the measured baseline (90.6% on 2026-10-17); ratchet up, never down.
fail_under = 88
show_missing = true
